name: Build and publish NetRelay

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: go.sum
      - run: go test ./...

  build-gui-frontend:
    name: GUI frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: gui/frontend

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            output: netrelay-windows-amd64.exe
          - os: darwin
            arch: amd64
            output: netrelay-darwin-amd64
          - os: darwin
            arch: arm64
            output: netrelay-darwin-arm64
          - os: linux
            arch: amd64
            output: netrelay-linux-amd64
          - os: linux
            arch: arm64
            output: netrelay-linux-arm64
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: go.sum
      - run: |
          mkdir -p target
          go build -trimpath \
            -ldflags "-w -s -extldflags '-static' -X main.Version=${GITHUB_SHA}" \
            -o target/${{ matrix.output }}
      - uses: actions/upload-artifact@v6
        with:
          name: netrelay-${{ matrix.os }}-${{ matrix.arch }}
          path: target/${{ matrix.output }}
          if-no-files-found: error

  publish-package:
    name: Publish container package
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/netrelay
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
